# Gradle 构建参数
# 安卓工程在中文路径下也能正常工作，但给 JVM 多留点内存更稳
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# 这个工程放在中文路径下（...\软件\单词混记\android）。
# AGP 默认会拒绝非 ASCII 路径，并提示"most likely cause the build to fail
# on Windows"。实测确实能用，所以关掉这个检查。
# 和桌面端 rc.exe/cl.exe 在中文路径截断是同一类问题 —— 值得记一笔。
android.overridePathCheck=true

# ⚠ 关键：把 Gradle 的临时目录指到纯 ASCII 路径。
#
# 不加这一条时，单元测试会报
#   ClassNotFoundException: com.wordmix.app.SyncProtocolTest
# 而测试类**确实编译出来了**、classpath 里**也确实有它的目录**。
# 真正的原因是 Gradle 把 fork 出来的测试 worker 的 classpath 写进一个临时文件
# （~/.gradle/.tmp/gradle-worker-classpath*.txt），里面用反斜杠转义的
# 中文路径被按错误编码解读成了乱码：
#   ...\Desktop\杞欢\鍗曡瘝娣疯\android\...
# 于是 JVM 找不到那个目录 → 找不到类。
# 把临时目录换成 ASCII 路径即可（工程路径本身不用动）。
systemProp.java.io.tmpdir=C:/wm-tmp
